# 触发复读所需的连续不同用户数量（默认 3）
repeat_threshold: 3

# 触发打断复读的概率（0.0 ~ 1.0，0.1 表示 10% 概率）
interrupt_probability: 0.1

# 打断时抽取文本与画廊图片的相对权重
text_weight: 1
image_weight: 1

# 打断复读的画廊名称（从该画廊中随机抽选一张图片，若画廊不存在或无图片则回退至文本）
interrupt_gallery: "打断"

# 打断复读的文本词库
interrupt_texts:
  - "打断！"
  - "打破复读机"
  - "禁止套娃"
  - "不许复读！"
  - "复读机已损坏"
  - "打断复读"
