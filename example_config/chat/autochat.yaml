log_level: INFO
rpc:
  host: 127.0.0.1
  port: 12345
  token: CHANGE_ME
  consumer_id: autochat
  max_message_bytes: 134217728
  # url: ws://127.0.0.1:12345 # 仅客户端地址不同于监听地址时填写
summary:
  model: '' # 空字符串关闭摘要和旁观整理
  count: 100
  age_seconds: 1800
  per_hour: 2
chat:
  llm:
    model: # 第一项为主模型，后续项为显式后备模型
      - gg:gemini-3.8-flash
    emb_model: na-qwen3-embedding-0.6b # 引用 llm.text_embedding_models；留空禁用向量检索
    vision_model: '' # 仅纯文本主模型需要的可选图片描述模型
    timeout: 120
    max_tokens: 2048
  trigger:
    ambient_p: 0.04
    followup_p: 0.85
    ttl_seconds: 120
    attention_seconds: 120
    unanswered_limit: 2
    debounce: 2
    max_batch_wait: 5
    seed: 42
  budget:
    wakes_per_minute: 3
    calls_per_minute: 6
    max_rounds: 3
    max_read_calls: 4
  max_messages: 2
  reply_max_length: 512
  stickers:
    annotation_model: '' # 默认视觉主模型，否则使用 vision_model
    prefetch: 2 # 0 关闭预取；仍可按需 search_stickers
    max_per_turn: 2
    cooldown_seconds: 60
  context:
    input_tokens: 24000
    image_token_reserve: 4096
    # 85% 高水位、55% 重建目标由引擎统一维护
  media:
    total_bytes: 2147483648
    file_bytes: 20971520
    original_days: 7
    preview_days: 30
  prompt:
    persona:
      default: |
        你作为固定人设群友参与日常聊天，简短自然；不适合参与时保持沉默。
      '12345678': |
        编写该群专用人设。
